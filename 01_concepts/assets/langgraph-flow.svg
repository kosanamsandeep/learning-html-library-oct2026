<svg width="920" height="540" viewBox="0 0 920 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="540" rx="28" fill="#FFFBF5"/>
  <text x="460" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1917">LangGraph end-to-end flow</text>
  <rect x="64" y="116" width="140" height="86" rx="18" fill="#D7F3EF" stroke="#0F766E" stroke-width="2"/>
  <text x="134" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#115E59">Input</text>
  <text x="134" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#115E59">user query</text>
  <rect x="236" y="116" width="160" height="86" rx="18" fill="#FFF1E7" stroke="#C2410C" stroke-width="2"/>
  <text x="316" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#9A3412">State</text>
  <text x="316" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9A3412">messages, vars,</text>
  <text x="316" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9A3412">intermediate results</text>
  <rect x="428" y="116" width="174" height="86" rx="18" fill="#D7F3EF" stroke="#0F766E" stroke-width="2"/>
  <text x="515" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#115E59">Node</text>
  <text x="515" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#115E59">LLM call, tool call,</text>
  <text x="515" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#115E59">router, validator</text>
  <rect x="634" y="116" width="214" height="86" rx="18" fill="#F5EBDD" stroke="#A16207" stroke-width="2"/>
  <text x="741" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#854D0E">Conditional Edge</text>
  <text x="741" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#854D0E">decides next step</text>
  <text x="741" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#854D0E">based on state</text>
  <path d="M204 159H236" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M396 159H428" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M602 159H634" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <rect x="112" y="288" width="210" height="94" rx="20" fill="#FFFFFF" stroke="#D9CCB8" stroke-width="2"/>
  <text x="217" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Planner node</text>
  <text x="217" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5F564D">decide if tools are needed</text>
  <rect x="354" y="288" width="210" height="94" rx="20" fill="#FFFFFF" stroke="#D9CCB8" stroke-width="2"/>
  <text x="459" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Tool node</text>
  <text x="459" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5F564D">call API, DB, search, MCP</text>
  <rect x="596" y="288" width="210" height="94" rx="20" fill="#FFFFFF" stroke="#D9CCB8" stroke-width="2"/>
  <text x="701" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Response node</text>
  <text x="701" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5F564D">compose final answer</text>
  <path d="M322 335H354" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M564 335H596" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M701 382V430H217V382" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <text x="462" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5F564D">State is updated after each node, enabling loops, retries, branching, and checkpoints.</text>
</svg>