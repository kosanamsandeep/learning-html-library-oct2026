<svg width="920" height="520" viewBox="0 0 920 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="520" rx="28" fill="#FFFBF5"/>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1917">MCP end-to-end flow</text>
  <rect x="48" y="124" width="180" height="104" rx="22" fill="#D7F3EF" stroke="#0F766E" stroke-width="2"/>
  <text x="138" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#115E59">Host App</text>
  <text x="138" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#115E59">agent, IDE, desktop</text>
  <text x="138" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#115E59">assistant, etc.</text>
  <rect x="266" y="124" width="188" height="104" rx="22" fill="#FFF1E7" stroke="#C2410C" stroke-width="2"/>
  <text x="360" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#9A3412">MCP Client</text>
  <text x="360" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9A3412">session, capability</text>
  <text x="360" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9A3412">negotiation, dispatch</text>
  <rect x="492" y="124" width="188" height="104" rx="22" fill="#D7F3EF" stroke="#0F766E" stroke-width="2"/>
  <text x="586" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#115E59">MCP Server</text>
  <text x="586" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#115E59">tools, resources,</text>
  <text x="586" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#115E59">prompts, schemas</text>
  <rect x="718" y="124" width="154" height="104" rx="22" fill="#F5EBDD" stroke="#A16207" stroke-width="2"/>
  <text x="795" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#854D0E">System</text>
  <text x="795" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#854D0E">DB, files, APIs,</text>
  <text x="795" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#854D0E">internal services</text>
  <path d="M228 176H266" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M454 176H492" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <path d="M680 176H718" stroke="#5F564D" stroke-width="3" stroke-linecap="round"/>
  <text x="247" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5F564D">user request</text>
  <text x="473" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5F564D">tool call</text>
  <text x="699" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5F564D">real operation</text>
  <rect x="86" y="300" width="748" height="152" rx="24" fill="#FFFFFF" stroke="#D9CCB8" stroke-width="2"/>
  <text x="460" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1C1917">Why this matters</text>
  <text x="460" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5F564D">MCP standardizes how AI hosts discover and use capabilities.</text>
  <text x="460" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5F564D">That reduces custom plugin glue and makes tool ecosystems portable.</text>
  <text x="460" y="422" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5F564D">It solves an interoperability problem, not just a transport problem.</text>
</svg>